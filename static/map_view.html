<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시 동물병원 지도 시제품</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      color: #202124;
    }
    header { padding: 16px 20px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 6px 0; }
    #map { height: 72vh; min-height: 350px; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; }
    .green { color: #15803d; }
    .red { color: #dc2626; }
    .blue { color: #2563eb; }
    .popup {
      padding: 12px;
      min-width: 220px;
      max-width: 300px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .popup strong { display: block; margin-bottom: 8px; }
    .popup div { margin-top: 5px; }
    footer { padding: 12px 20px; color: #555; }
  </style>
</head>

<body>
  <header>
    <h1>서울시 동물병원 지도</h1>
    <p> 11조 예시 지도.</p>
    <div class="legend">
      <span class="green">● 정상영업</span>
      <span class="red">● 휴업</span>
      <span class="blue">● 사용자 위치</span>
    </div>
    <p id="message">지도를 불러오는 중입니다.</p>
  </header>

  <div id="map"></div>
  <footer>병원 마커를 클릭하면 상세정보가 표시됩니다.</footer>

  <script>
    const data = __MAP_PAYLOAD__;
    const message = document.getElementById("message");

    const sdk = document.createElement("script");
    sdk.src =
      "https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey="
      + encodeURIComponent(data.javascriptKey);

    sdk.onerror = () => {
      message.textContent =
        "지도 로딩 실패: 인터넷 연결, JavaScript 키와 등록 도메인을 확인하세요.";
    };

    sdk.onload = () => {
      if (!window.kakao || !window.kakao.maps) {
        message.textContent = "카카오 지도 사용 설정을 확인하세요.";
        return;
      }
      kakao.maps.load(drawMap);
    };

    document.head.appendChild(sdk);

    function drawMap() {
      const map = new kakao.maps.Map(document.getElementById("map"), {
        center: new kakao.maps.LatLng(37.6194, 127.0598),
        level: 7
      });

      const bounds = new kakao.maps.LatLngBounds();
      const infoWindow = new kakao.maps.InfoWindow({ removable: true });
      let pointCount = 0;

      function markerImage(color) {
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40">
            <path d="M16 39C13 33 2 23 2 16a14 14 0 1 1 28 0c0 7-11 17-14 23"
                  fill="${color}" stroke="white" stroke-width="2"/>
            <circle cx="16" cy="16" r="5" fill="white"/>
          </svg>`;

        return new kakao.maps.MarkerImage(
          "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg),
          new kakao.maps.Size(32, 40),
          { offset: new kakao.maps.Point(16, 40) }
        );
      }

      function popupContent(hospital) {
        const box = document.createElement("div");
        box.className = "popup";

        const title = document.createElement("strong");
        title.textContent = hospital.name;
        box.appendChild(title);

        for (const text of [
          `영업 상태: ${hospital.status}`,
          `전화번호: ${hospital.phone}`,
          `주소: ${hospital.address}`
        ]) {
          const row = document.createElement("div");
          row.textContent = text;
          box.appendChild(row);
        }

        return box;
      }

      for (const hospital of data.hospitals) {
        const position = new kakao.maps.LatLng(
          hospital.latitude, hospital.longitude
        );

        const marker = new kakao.maps.Marker({
          map,
          position,
          title: hospital.name,
          image: markerImage(
            hospital.status === "휴업" ? "#dc2626" : "#15803d"
          )
        });

        kakao.maps.event.addListener(marker, "click", () => {
          infoWindow.setContent(popupContent(hospital));
          infoWindow.open(map, marker);
        });

        bounds.extend(position);
        pointCount += 1;
      }

      if (data.userLocation) {
        const position = new kakao.maps.LatLng(
          data.userLocation.latitude,
          data.userLocation.longitude
        );

        new kakao.maps.Marker({
          map,
          position,
          title: "사용자 위치(광운대학교)",
          image: markerImage("#2563eb")
        });

        bounds.extend(position);
        pointCount += 1;

        if (data.radiusM) {
          const circle = new kakao.maps.Circle({
            map,
            center: position,
            radius: data.radiusM,
            strokeWeight: 2,
            strokeColor: "#2563eb",
            strokeOpacity: 0.8,
            fillColor: "#93c5fd",
            fillOpacity: 0.2
          });

          bounds.extend(circle.getBounds().getSouthWest());
          bounds.extend(circle.getBounds().getNorthEast());
        }
      }

      if (pointCount > 0) {
        map.setBounds(bounds);
      }

      kakao.maps.event.addListener(map, "click", () => infoWindow.close());

      message.textContent = data.hospitals.length > 0
        ? `병원 ${data.hospitals.length}개 표시 중`
        : "표시할 병원이 없습니다.";
    }
  </script>
</body>
</html>
