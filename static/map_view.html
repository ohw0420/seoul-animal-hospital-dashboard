<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울시 동물병원 지도</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      color: #20334a;
      background: #f5f7fb;
      height:100dvh;min-height:600px;display:flex;flex-direction:column;
    }
    header { padding: 16px 20px; }
    h1 { margin: 0 0 4px; font-size: 21px; }
    p { margin: 4px 0; }
    #map-shell{flex:1;min-height:260px;width:100%;position:relative;border-top:1px solid #d2deea;border-bottom:1px solid #d2deea}
    #map {position:absolute;inset:0;width:100%;height:100%}
    .legend { display: flex; gap: 18px; flex-wrap: wrap; }
    .green { color: #15803d; }
    .red { color: #dc2626; }
    .blue { color: #2563eb; }
    .popup {
      padding: 12px;
      min-width: 220px;
      max-width: 300px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .popup strong { display: block; margin-bottom: 8px; }
    .popup div { margin-top: 5px; }
    footer { padding: 12px 20px; color: #555; }
    button,select{font:inherit;padding:8px 12px;margin:4px;border:1px solid #b6c6d0;border-radius:6px;background:white;cursor:pointer}
    .district-label{padding:5px 9px;border-radius:16px;font-size:12px;color:#183c57;font-weight:600}
    [hidden]{display:none!important}
    header{flex:none;max-width:1400px;width:100%;margin:0 auto;padding:8px 20px 6px}h1{color:#245f83}
    footer{flex:none;padding:5px 20px;font-size:11px!important;line-height:1.3!important}
    #real-controls{display:flex;align-items:end;gap:20px;flex-wrap:wrap}
    .heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .heading-row .legend{font-size:13px;gap:14px}
    #source-label{font-size:12px;line-height:1.4}
    .toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:6px}
    .toolbar label{display:flex;flex-direction:column;gap:5px;font-size:14px}
    input{font:inherit;padding:6px 12px;border:1px solid #b6c6d0;border-radius:6px;background:white}
    .toolbar button,.toolbar select{padding-top:6px;padding-bottom:6px}
    #address{width:min(390px,80vw)}button[type=submit]{background:#245f83;color:white;border-color:#245f83}
    .radius-control{display:flex;flex-direction:column;gap:5px;font-size:14px}
    .radius-buttons{display:flex;align-items:center;gap:5px}
    .radius-buttons button{margin:0;width:36px;height:34px;padding:0;font-size:21px}
    #radius-display{min-width:64px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
    .radius-buttons button:disabled{cursor:default;opacity:.35}
    button:disabled{opacity:.6;cursor:wait}#message{min-height:20px;font-weight:600;font-size:14px;margin-top:4px;margin-bottom:0}
    .source{font-size:13px;color:#596b7f;line-height:1.5}.district-label{margin:0;background:white}
    .district-count{position:relative;display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;color:white;cursor:pointer;overflow:visible}
    .district-count-number{font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #12425e;pointer-events:none}
    .district-count-name{position:absolute;top:calc(14px + var(--circle-radius,20px) + 5px);left:50%;transform:translateX(-50%);padding:2px 5px;border-radius:4px;background:rgba(255,255,255,.93);color:#1a405a;font-size:12px;font-weight:700;line-height:1.3;white-space:nowrap;pointer-events:none}
    .district-count:focus-visible{outline:3px solid #f4b443;outline-offset:4px}
    .district-count.is-zero{background:#8299aa;border:1px solid white}
    .district-count-number.dark-number{color:#173246;text-shadow:0 1px 1px #ffffff80}
    .hospital-name{position:relative;top:5px;display:block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0;padding:2px 5px;border:1px solid #d2dce3;border-radius:4px;background:rgba(255,255,255,.94);color:#20334a;font-size:11px;line-height:1.3;font-weight:600;box-shadow:0 1px 2px #20334a18}
  </style>
</head>

<body>
  <header>
    <div class="heading-row">
    <h1>서울시 동물병원 지도</h1>
    <div class="legend">
      <span class="green">● 정상영업</span>
      <span class="red">● 휴업</span>
      <span class="blue">● 사용자 위치</span>
    </div>
    </div>
    <p id="source-label" class="source">집계 원 → 화면 중앙 주변에 걸친 구의 병원 → 더 확대하면 이름 · 원은 10개 단위로 진해집니다.</p>
    <div id="real-controls" hidden>
      <div class="toolbar">
        <label>자치구<select id="district-select"><option value="">서울 전체</option></select></label>
        <button id="overview-button" type="button">서울 전체</button>
        <button id="clear-user-button" type="button">사용자 위치 지우기</button>
      </div>
      <form id="nearby-form" class="toolbar">
        <label>내 주변 병원 검색<input id="address" name="address" placeholder="예: 서울특별시 중구 세종대로 110" required maxlength="300"></label>
        <div class="radius-control" role="group" aria-labelledby="radius-label">
          <span id="radius-label">검색 반경 (1~5km)</span>
          <div class="radius-buttons">
            <button type="button" id="radius-decrease" aria-label="반경 0.5km 줄이기" disabled>−</button>
            <output id="radius-display" aria-live="polite">1km</output>
            <button type="button" id="radius-increase" aria-label="반경 0.5km 늘리기">+</button>
          </div>
          <input id="radius" name="radius" type="hidden" value="1000">
        </div>
        <button type="submit" id="search-button">주변 검색</button>
      </form>
    </div>
    <div id="demo-controls" hidden></div>
    <p role="status" aria-live="polite" id="message">지도를 불러오는 중입니다.</p>
  </header>

  <div id="map-shell">
    <div id="map"></div>
  </div>
  <footer class="source">구를 클릭하면 확대되고, 넓게 축소하면 집계 원이 다시 나타납니다. 병원 마커를 클릭해 상세정보를 확인하세요.<br>집계에는 좌표가 없는 병원도 포함되어 마커 수와 다를 수 있습니다. 상태는 실시간 진료 여부가 아닙니다. 구 경계: 2013년 기준 참고용.</footer>

  <script>window.MAP_INITIAL_DATA = __MAP_PAYLOAD__;</script>
  <script src="/static/hospital_map.js"></script>
</body>
</html>
