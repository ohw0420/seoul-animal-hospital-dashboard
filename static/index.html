<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>서울 동물병원 지도</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- YOUR_JS_KEY 자리에 카카오 디벨로퍼스의 JavaScript 키를 넣으세요 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_JS_KEY"></script>
  <script>
    const map = new kakao.maps.Map(document.getElementById("map"), {
      center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울시청
      level: 8                                          // 숫자가 클수록 넓게 보임
    });
  </script>
</body>
</html>
